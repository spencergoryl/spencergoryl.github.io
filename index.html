<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Engram</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Averia+Serif+Libre:wght@400;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <canvas id="canvas"></canvas>

   <!-- ENGRAM definition trigger -->
<button
    id="engram-trigger"
    aria-label="Show definition of Engram">
</button>

<!-- ENGRAM definition -->
<div id="engram-definition">
    <div class="definition-text">
        [a physical change in the brain caused by a deeply impactful memory]
    </div>
</div>
    
<nav id="art-navigation">

    <div class="art-item">
        <span class="art-title">Solar Steam</span>
        <button
            class="art-button"
            data-art="solar-steam"
            aria-label="Open Solar Steam">
        </button>
    </div>

    <div class="art-item">
        <span class="art-title">Cloud Break</span>
        <button
            class="art-button"
            data-art="cloud-break"
            aria-label="Open Cloud Break">
        </button>
    </div>

    <div class="art-item">
        <span class="art-title">Clinical Perception</span>
        <button
            class="art-button"
            data-art="clinical-perception"
            aria-label="Open Clinical Perception">
        </button>
    </div>

    <div class="art-item">
        <span class="art-title">Idle Thought</span>
        <button
            class="art-button"
            data-art="idle-thought"
            aria-label="Open Idle Thought">
        </button>
    </div>

</nav>

    <div id="art-viewer">

    <button
        id="viewer-close"
        aria-label="Close artwork">
        ×
    </button>

    <div id="viewer-stage">

        <img
            id="viewer-image"
            src=""
            alt=""
            draggable="false">

    </div>

</div>
    <script src="script.js"></script>

</body>

</html>
